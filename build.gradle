plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.akshit.comefort'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

application {
    mainClass = 'com.akshit.comefort.App'
}

// JavaFX modules required for the GUI
javafx {
    version = '22.0.2'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

repositories {
    mavenCentral()
}

dependencies {
    // SQLite JDBC driver — embedded, serverless, zero-config
    implementation 'org.xerial:sqlite-jdbc:3.47.2.0'

    // CLI argument parsing — handles subcommands, flags, help text
    implementation 'info.picocli:picocli:4.7.6'

    // Annotation processor for picocli (compile-time generation)
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // Google Fonts via ikonli (for premium typography icons)
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'

    // Pseudo-terminal (PTY / ConPTY) for real interactive terminal emulation
    implementation 'org.jetbrains.pty4j:pty4j:0.13.13'
    implementation 'com.techsenger.jeditermfx:jeditermfx-core:1.1.0'
    implementation 'com.techsenger.jeditermfx:jeditermfx-ui:1.1.0'
    implementation 'org.slf4j:slf4j-nop:2.0.16'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Dev mode: Launch GUI directly (./gradlew gui)
tasks.register('gui', JavaExec) {
    group = 'application'
    description = 'Launch ComeFort Desktop GUI in real-time dev mode'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.akshit.comefort.App'
    args = ['--gui']
}

// Ensure picocli knows about the annotation processor
compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

// Name the distribution scripts 'comefort'
tasks.named('startScripts') {
    applicationName = 'comefort'
}

// Generate the twin 'cmf' executable scripts directly into the bin folder
tasks.register('createCmfAlias', Copy) {
    dependsOn 'startScripts'
    from(tasks.named('startScripts').map { it.outputDir }) {
        include 'comefort'
        include 'comefort.bat'
    }
    into tasks.named('startScripts').map { it.outputDir }
    rename 'comefort', 'cmf'
    rename 'comefort.bat', 'cmf.bat'
}

tasks.named('startScripts') {
    finalizedBy 'createCmfAlias'
}

tasks.named('installDist') {
    dependsOn 'createCmfAlias'
}
tasks.named('distZip') {
    dependsOn 'createCmfAlias'
}
tasks.named('distTar') {
    dependsOn 'createCmfAlias'
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

tasks.register('generateLauncherProps') {
    dependsOn 'installDist'
    doLast {
        def tmpDir = layout.buildDirectory.dir('tmp').get().asFile
        tmpDir.mkdirs()
        def launcherConfig = "main-jar=comefort-${version}.jar\nmain-class=com.akshit.comefort.App\nwin-console=true\n"
        new File(tmpDir, 'cmf.properties').text = launcherConfig
        new File(tmpDir, 'comefort.properties').text = launcherConfig
        def distNativeDir = layout.buildDirectory.dir('dist-native').get().asFile
        distNativeDir.deleteDir()
        distNativeDir.mkdirs()
    }
}

// Builds native standalone app image with bundled Java runtime (no Java required by user)
tasks.register('packageNative', Exec) {
    dependsOn 'generateLauncherProps'
    commandLine 'jpackage',
        '--type', 'app-image',
        '--name', 'ComeFort',
        '--app-version', project.version.toString(),
        '--input', "${layout.buildDirectory.get().asFile}/install/comefort/lib",
        '--main-jar', "comefort-${version}.jar",
        '--main-class', 'com.akshit.comefort.gui.GuiLauncher',
        '--add-launcher', "cmf=${layout.buildDirectory.get().asFile}/tmp/cmf.properties",
        '--add-launcher', "comefort=${layout.buildDirectory.get().asFile}/tmp/comefort.properties",
        '--dest', "${layout.buildDirectory.get().asFile}/dist-native"
}

// Zips the native bundle into a distributable archive
tasks.register('packageNativeZip', Zip) {
    dependsOn 'packageNative'
    archiveFileName = "ComeFort-v${project.version}-windows-x64.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('dist-native/ComeFort')) {
        into 'ComeFort'
    }
}

